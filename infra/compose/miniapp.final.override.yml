services:
  api:
    working_dir: /app
    env_file:
      - .env.miniapp
    environment:
      # Notion token(s)
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_SECRET: ${NOTION_SECRET:-}
      NOTION_TIMEOUT: ${NOTION_TIMEOUT:-10}

      # Skills DB
      NOTION_DB_SKILLS: ${NOTION_DB_SKILLS}
      # optional shared DB id fallback
      NOTION_DB: ${NOTION_DB:-}

      # Tasks DB
      NOTION_PUBLIC_TASKS_DB_ID: ${NOTION_PUBLIC_TASKS_DB_ID:-}

      # Brief upload configuration
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      UPLOAD_DIR: /app/uploads/briefs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,doc,docx,txt,png,jpg,jpeg,zip}

    volumes:
      - ./data/uploads:/app/uploads

    command:
      - uvicorn
      - apps.miniapp_api.main:app
      - --host=0.0.0.0
      - --port=8080
      - --proxy-headers
      - --forwarded-allow-ips=*


