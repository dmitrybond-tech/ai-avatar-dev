x-miniapp-env: &miniapp_env
  - .env.miniapp

services:
  api:
    working_dir: /app
    env_file: *miniapp_env
    environment:
      # Notion token(s)
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_SECRET: ${NOTION_SECRET:-}
      NOTION_TIMEOUT: ${NOTION_TIMEOUT:-10}
      NOTION_CACHE_TTL_SKILLS: ${NOTION_CACHE_TTL_SKILLS:-300}
      SKILLS_SOURCE: ${SKILLS_SOURCE:-auto}
      SKILLS_CSV_PATH: ${SKILLS_CSV_PATH:-/app/data/skills.csv}

      # Skills DB
      NOTION_DB_SKILLS: ${NOTION_DB_SKILLS}
      # optional shared DB id fallback
      NOTION_DB: ${NOTION_DB:-}

      # Tasks DB
      NOTION_PUBLIC_TASKS_DB_ID: ${NOTION_PUBLIC_TASKS_DB_ID:-}

      # Brief upload configuration
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      UPLOAD_DIR: /app/uploads/briefs
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-64}
      ALLOWED_EXT: ${ALLOWED_EXT:-pdf,doc,docx,txt,png,jpg,jpeg,zip}

    volumes:
      - ./data/uploads:/app/uploads

    command:
      - uvicorn
      - apps.miniapp_api.main:app
      - --host=0.0.0.0
      - --port=8080
      - --proxy-headers
      - --forwarded-allow-ips=*

  bot:
    env_file: *miniapp_env

  web:
    volumes:
      - ../../apps/miniapp-web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


