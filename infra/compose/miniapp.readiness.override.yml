services:
  api:
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8000/api/healthz || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
  web:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/ || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

