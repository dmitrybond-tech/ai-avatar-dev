services:
  api:
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/api/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  bot:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import os,urllib.request,sys;url=os.getenv('API_BASE_URL','http://api:8000').rstrip('/');urllib.request.urlopen(f'{url}/api/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 20s
