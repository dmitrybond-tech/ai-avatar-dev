services:
  api:
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8000/api/healthz >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  bot:
    depends_on:
      api:
        condition: service_healthy
