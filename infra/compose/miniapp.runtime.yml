services:
  web:
    image: ${WEB_IMAGE}:${WEB_TAG}
    ports:
      - "127.0.0.1:15173:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    pull_policy: always

  api:
    image: ${API_IMAGE}:${API_TAG}
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    pull_policy: always

  bot:
    image: ${BOT_IMAGE}:${BOT_TAG}
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env.miniapp

volumes:
  bot-data: {}
