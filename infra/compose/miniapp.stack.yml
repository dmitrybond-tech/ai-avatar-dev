services:
  api:
    image: ${IMAGE_API:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-api}:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    environment:
      - PORT=8080
      - DEFAULT_LANG=${DEFAULT_LANG:-ru}
      - CAL_USERNAME=${CAL_USERNAME:-dmitrybond}
      - CAL_HOST=${CAL_HOST:-cal.com}
      - NOTION_TIMEOUT=${NOTION_TIMEOUT:-10}
      - NOTION_CACHE_TTL_SKILLS=${NOTION_CACHE_TTL_SKILLS:-300}
      - SKILLS_SOURCE=${SKILLS_SOURCE:-auto}
      - SKILLS_CSV_PATH=${SKILLS_CSV_PATH:-/app/data/skills.csv}
      - NOTION_API_KEY=${NOTION_API_KEY:-}
      - NOTION_DB_SKILLS=${NOTION_DB_SKILLS:-}
      - WEBSITE_ORIGIN=${WEBSITE_ORIGIN:-https://miniapp.dmitrybond.tech}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    image: ${IMAGE_BOT:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-bot}:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env.miniapp
    depends_on:
      - api

  web:
    image: ${IMAGE_WEB:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-web}:${IMAGE_TAG:-main}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


