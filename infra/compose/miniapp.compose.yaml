services:
  api:
    image: ${IMAGE_API:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-api}:${IMAGE_TAG:-main}
    pull_policy: always
    env_file:
      - .env.miniapp
    environment:
      - PORT=8080
      - CAL_USERNAME=${CAL_USERNAME:-dmitrybond}
      - CAL_HOST=${CAL_HOST:-cal.com}
      - DEFAULT_LANG=${DEFAULT_LANG:-ru}
      - NOTION_TIMEOUT=${NOTION_TIMEOUT:-10}
      - WEBSITE_ORIGIN=${WEBSITE_ORIGIN:-https://miniapp.dmitrybond.tech}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    image: ${IMAGE_BOT:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-bot}:${IMAGE_TAG:-main}
    pull_policy: always
    env_file:
      - .env.miniapp
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - BOT_MODE=${BOT_MODE:-polling}
      - TELEGRAM_BOT_NAME=${TELEGRAM_BOT_NAME}
      - API_BASE_URL=${API_BASE_URL:-http://api:8080}
      - DEFAULT_LANG=${DEFAULT_LANG:-ru}
      - CAL_USERNAME=${CAL_USERNAME:-dmitrybond}
      - CAL_EVENT_INTRO=${CAL_EVENT_INTRO:-intro-30m}
      - WEBAPP_URL=${WEBAPP_URL:-http://web:8080}
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: ${IMAGE_WEB:-ghcr.io/dmitrybond-tech/ai-avatar-miniapp-web}:${IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

