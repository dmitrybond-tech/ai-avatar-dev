version: '3.9'
services:
  api:
    build:
      context: ../../
      dockerfile: apps/miniapp-api/Dockerfile
    environment:
      - PORT=8080
      - CAL_USERNAME=${CAL_USERNAME:-dmitrybond}
      - CAL_HOST=${CAL_HOST:-cal.com}
      - DEFAULT_LANG=${DEFAULT_LANG:-ru}
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: ../../
      dockerfile: apps/miniapp-bot/Dockerfile
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_BOT_NAME=${TELEGRAM_BOT_NAME}
      - API_BASE_URL=${API_BASE_URL:-http://api:8080}
      - DEFAULT_LANG=${DEFAULT_LANG:-ru}
      - CAL_USERNAME=${CAL_USERNAME:-dmitrybond}
      - CAL_EVENT_INTRO=${CAL_EVENT_INTRO:-intro-30m}
      - WEBAPP_URL=${WEBAPP_URL:-http://web:5173}
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ../../apps/miniapp-web
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8080}
        - VITE_DEFAULT_LANG=${VITE_DEFAULT_LANG:-ru}
    restart: unless-stopped
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

