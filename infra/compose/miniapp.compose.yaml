services:
  gateway:
    build:
      context: ../../apps/miniapp-gateway
      dockerfile: Dockerfile
    container_name: miniapp-gateway
    env_file:
      - .env.miniapp
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: ../../apps/miniapp-bot
      dockerfile: Dockerfile
    container_name: miniapp-bot
    env_file:
      - .env.miniapp
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

