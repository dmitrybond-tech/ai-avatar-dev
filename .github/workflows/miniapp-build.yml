name: Build Miniapp Images

on:
  push:
    branches:
      - main
    paths:
      - "apps/miniapp-api/**"
      - "apps/miniapp_api/**"
      - "apps/miniapp-web/**"
      - ".github/workflows/miniapp-build.yml"
      - "infra/compose/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dmitrybond-tech

jobs:
  build-and-push:
    name: Build & Push Miniapp Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: prep
        run: |
          short_sha="${GITHUB_SHA::7}"
          utc_stamp="$(date -u +%Y%m%dT%H%MZ)"
          version_tag="${short_sha}-${utc_stamp}"
          {
            echo "short_sha=${short_sha}"
            echo "utc=${utc_stamp}"
            echo "version_tag=${version_tag}"
            echo "api_image=${REGISTRY}/${IMAGE_OWNER}/ai-avatar-miniapp-api"
            echo "web_image=${REGISTRY}/${IMAGE_OWNER}/ai-avatar-miniapp-web"
          } >>"${GITHUB_OUTPUT}"

      - name: Build & push API image
        id: build_api
        run: |
          api_image="${{ steps.prep.outputs.api_image }}"
          version_tag="${{ steps.prep.outputs.version_tag }}"
          docker buildx build \
            --platform linux/amd64 \
            -t "${api_image}:main" \
            -t "${api_image}:${version_tag}" \
            --push \
            apps/miniapp-api

          digest="$(docker buildx imagetools inspect "${api_image}:${version_tag}" | grep -m1 "Digest:" | awk '{print $2}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build & push Web image
        id: build_web
        run: |
          web_image="${{ steps.prep.outputs.web_image }}"
          version_tag="${{ steps.prep.outputs.version_tag }}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=/api \
            -t "${web_image}:main" \
            -t "${web_image}:${version_tag}" \
            --push \
            apps/miniapp-web

          digest="$(docker buildx imagetools inspect "${web_image}:${version_tag}" | grep -m1 "Digest:" | awk '{print $2}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Summarize digests
        run: |
          cat <<'EOF' >> "${GITHUB_STEP_SUMMARY}"
          ## Miniapp image digests
          - API: `${{ steps.prep.outputs.api_image }}@${{ steps.build_api.outputs.digest }}`
          - Web: `${{ steps.prep.outputs.web_image }}@${{ steps.build_web.outputs.digest }}`
          - Tags: `main`, `${{ steps.prep.outputs.version_tag }}`
          EOF

