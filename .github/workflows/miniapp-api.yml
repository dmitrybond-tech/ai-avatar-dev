name: MiniApp API - Build & Push

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/miniapp-api/**'
      - '.github/workflows/miniapp-api.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-api

jobs:
  build-and-push:
    name: Build and Push API
    runs-on: ubuntu-24.04
    concurrency:
      group: miniapp-api-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./apps/miniapp-api
          file: ./apps/miniapp-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=miniapp-api
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p dist
          echo "${{ env.IMAGE }}@$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.sha }} --format '{{json .Manifest.Digest}}' | sed 's/[\"}]//g')" > dist/image-digest.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: miniapp-api-image-digest
          path: dist/image-digest.txt

