name: MiniApp Images — Build & Push (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push:
        description: "Also push images to GHCR"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dmitrybond-tech

jobs:
  build-and-push:
    concurrency:
      group: miniapp-images-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ai-avatar-miniapp-api
            context: .
            file: apps/miniapp-api/Dockerfile
            build-args: ""
          - name: web
            image: ai-avatar-miniapp-web
            context: apps/miniapp-web
            file: apps/miniapp-web/Dockerfile
            build-args: |
              VITE_API_BASE_URL=https://miniapp.dmitrybond.tech
              VITE_DEFAULT_LANG=ru
          - name: bot
            image: ai-avatar-miniapp-bot
            context: .
            file: apps/miniapp-bot/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Push on push to main, or when manually requested via workflow_dispatch input
          push: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.push == 'true') }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max


