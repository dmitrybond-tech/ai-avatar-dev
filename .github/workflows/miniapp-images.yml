name: MiniApp Images — Build & Push (GHCR)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/miniapp-web/**'
      - 'apps/miniapp-api/**'
      - 'apps/miniapp-bot/**'
      - 'apps/miniapp_bot/**'
      - '.github/workflows/miniapp-images.yml'
  workflow_dispatch: {}

jobs:
  web:
    name: Build & Push Web
    runs-on: ubuntu-24.04
    concurrency:
      group: miniapp-web-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./apps/miniapp-web
          file: ./apps/miniapp-web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=miniapp-web
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p dist
          echo "${{ env.IMAGE }}@$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.sha }} --format '{{json .Manifest.Digest}}' | sed 's/[\"}]//g')" > dist/image-digest-web.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: miniapp-web-image-digest
          path: dist/image-digest-web.txt

  api:
    name: Build & Push API
    runs-on: ubuntu-24.04
    concurrency:
      group: miniapp-api-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./apps/miniapp-api
          file: ./apps/miniapp-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=miniapp-api
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p dist
          echo "${{ env.IMAGE }}@$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.sha }} --format '{{json .Manifest.Digest}}' | sed 's/[\"}]//g')" > dist/image-digest-api.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: miniapp-api-image-digest
          path: dist/image-digest-api.txt

  bot:
    name: Build & Push Bot
    runs-on: ubuntu-24.04
    concurrency:
      group: miniapp-bot-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Login to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push (apps/miniapp-bot if exists)
        if: ${{ hashFiles('apps/miniapp-bot/Dockerfile') != '' }}
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./apps/miniapp-bot
          file: ./apps/miniapp-bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=miniapp-bot
          provenance: false
          sbom: false

      - name: Build and Push (apps/miniapp_bot fallback)
        if: ${{ hashFiles('apps/miniapp-bot/Dockerfile') == '' }}
        uses: docker/build-push-action@v6.9.0
        with:
          context: ./apps/miniapp_bot
          file: ./apps/miniapp_bot/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=miniapp-bot
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p dist
          echo "${{ env.IMAGE }}@$(docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.sha }} --format '{{json .Manifest.Digest}}' | sed 's/[\"}]//g')" > dist/image-digest-bot.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: miniapp-bot-image-digest
          path: dist/image-digest-bot.txt
name: MiniApp Images — Build & Push (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push:
        description: "Also push images to GHCR"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: dmitrybond-tech

jobs:
  build-and-push:
    concurrency:
      group: miniapp-images-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ai-avatar-miniapp-api
            context: .
            file: apps/miniapp-api/Dockerfile
            build-args: ""
          - name: web
            image: ai-avatar-miniapp-web
            context: apps/miniapp-web
            file: apps/miniapp-web/Dockerfile
            build-args: |
              VITE_API_BASE_URL=https://miniapp.dmitrybond.tech
              VITE_DEFAULT_LANG=ru
          - name: bot
            image: ai-avatar-miniapp-bot
            context: .
            file: apps/miniapp-bot/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Push on push to main, or when manually requested via workflow_dispatch input
          push: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.push == 'true') }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max


