name: Miniapp — Build & Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, bot]
    concurrency:
      group: miniapp-${{ github.ref_name }}-build
      cancel-in-progress: true
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai-avatar-miniapp-${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context
        id: paths
        run: |
          case "${{ matrix.service }}" in
            api)
              echo "context=apps/miniapp-api" >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/miniapp-api/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "context=apps/miniapp-web" >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/miniapp-web/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            bot)
              echo "context=apps/miniapp-bot" >> "$GITHUB_OUTPUT"
              echo "dockerfile=apps/miniapp-bot/Dockerfile" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown service" >&2
              exit 1
              ;;
          esac

      - name: Install API dependencies for route check
        if: ${{ matrix.service == 'api' }}
        run: |
          target="${RUNNER_TEMP}/miniapp-api-deps"
          mkdir -p "$target"
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/miniapp-api/requirements.txt --target "$target"
          python -m pip install --disable-pip-version-check --no-cache-dir python-multipart --target "$target"
          echo "ROUTE_CHECK_PYTHONPATH=$target" >> "$GITHUB_ENV"

      - name: Verify briefs upload route exists
        if: ${{ matrix.service == 'api' }}
        env:
          DATA_DIR: ${{ runner.temp }}/miniapp-api
          PYTHONPATH: ${{ env.ROUTE_CHECK_PYTHONPATH }}:${{ github.workspace }}
        run: |
          python - <<'PY'
          from fastapi.routing import APIRoute
          try:
              from apps.miniapp_api.main import app
          except Exception as exc:
              import traceback
              traceback.print_exc()
              raise SystemExit(f"Failed to import FastAPI app: {exc}")

          paths = {route.path for route in app.routes if isinstance(route, APIRoute)}
          required = "/briefs/upload"
          if required not in paths:
              listing = "\n".join(sorted(paths))
              raise SystemExit(f"Missing required route {required}. Registered routes:\n{listing}")
          PY

      - name: Compute image tags
        id: meta
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tags="${IMAGE_NAME}:main"
          tags+=$'\n'"${IMAGE_NAME}:${short_sha}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=$'\n'"${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          created=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6.9.0
        with:
          context: ${{ steps.paths.outputs.context }}
          file: ${{ steps.paths.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

