name: CI — Main Images

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Print context
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

      - name: Checkout
        uses: actions/checkout@v4

  build-images:
    name: Build Images
    runs-on: ubuntu-24.04
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare metadata
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"

      - name: Resolve miniapp-web image
        id: web
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          dockerfile="apps/miniapp-web/Dockerfile"
          if [ -f "$dockerfile" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "context=apps/miniapp-web" >> "$GITHUB_OUTPUT"
            echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
            echo "image=ghcr.io/${OWNER}/${REPO}-miniapp-web" >> "$GITHUB_OUTPUT"
            echo "reason=Dockerfile detected" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=apps/miniapp-web/Dockerfile not found" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve api image
        id: api
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          primary="apps/miniapp-api/Dockerfile"
          fallback="apps/api/Dockerfile"
          if [ -f "$primary" ]; then
            context_dir="apps/miniapp-api"
            dockerfile="$primary"
          elif [ -f "$fallback" ]; then
            context_dir="apps/api"
            dockerfile="$fallback"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "reason=No api Dockerfile found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "context=${context_dir}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${dockerfile}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/${REPO}-miniapp-api" >> "$GITHUB_OUTPUT"
          echo "reason=Dockerfile detected" >> "$GITHUB_OUTPUT"

      - name: Skip miniapp-web build
        if: ${{ steps.web.outputs.should_build != 'true' }}
        run: echo "miniapp-web not built: ${{ steps.web.outputs.reason }}"

      - name: Build and push miniapp-web image
        if: ${{ steps.web.outputs.should_build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.web.outputs.context }}
          file: ${{ steps.web.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.web.outputs.image }}:main
            ${{ steps.web.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=miniapp-web
          cache-to: type=gha,mode=max,scope=miniapp-web
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_DEFAULT_LANG=${{ vars.VITE_DEFAULT_LANG }}

      - name: Skip api build
        if: ${{ steps.api.outputs.should_build != 'true' }}
        run: echo "api not built: ${{ steps.api.outputs.reason }}"

      - name: Build and push api image
        if: ${{ steps.api.outputs.should_build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.api.outputs.context }}
          file: ${{ steps.api.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.api.outputs.image }}:main
            ${{ steps.api.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=miniapp-api
          cache-to: type=gha,mode=max,scope=miniapp-api

