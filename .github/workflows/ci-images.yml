name: Build and Push Images to GHCR

on:
  push:
    branches:
      - main
      - feature/miniapp-containers
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-api
  IMAGE_WEB: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-web
  IMAGE_BOT: ghcr.io/dmitrybond-tech/ai-avatar-miniapp-bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: .
            dockerfile: apps/miniapp-api/Dockerfile
            image: ${{ env.IMAGE_API }}
          - service: web
            context: .
            dockerfile: apps/miniapp-web/Dockerfile
            image: ${{ env.IMAGE_WEB }}
          - service: bot
            context: .
            dockerfile: apps/miniapp-bot/Dockerfile
            image: ${{ env.IMAGE_BOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=feature-miniapp-containers,enable=${{ github.ref == 'refs/heads/feature/miniapp-containers' }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=https://miniapp.dmitrybond.tech
            VITE_DEFAULT_LANG=ru
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
