<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniApp Web</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="icons/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Initialize Telegram WebApp if present (guarded)
      try {
        var tg = window && window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.ready === 'function') {
          try { if (typeof tg.expand === 'function') tg.expand(); } catch (e) { console.warn('TG expand skipped', e); }
          tg.ready();
        }
      } catch (e) { console.warn('TG init skipped', e); }
    </script>

    <!-- Cal.com embed loader (idempotent) -->
    <script type="text/javascript">
      (function (C, A, L) {
        let p = function (a, ar) { a.q.push(ar); };
        let d = C.document;
        C.Cal = C.Cal || function () {
          let cal = C.Cal, ar = arguments;
          if (!cal.loaded) {
            cal.ns = {}; cal.q = cal.q || [];
            var s = d.createElement("script");
            s.src = A; d.head.appendChild(s);
            cal.loaded = true;
          }
          if (ar[0] === L) {
            const api = function () { p(api, arguments); };
            const namespace = ar[1];
            api.q = api.q || [];
            if (typeof namespace === "string") {
              cal.ns[namespace] = cal.ns[namespace] || api;
              p(cal.ns[namespace], ar);
              p(cal, ["initNamespace", namespace]);
            } else p(cal, ar);
            return;
          }
          p(cal, ar);
        };
      })(window, "https://app.cal.com/embed/embed.js", "init");

      // Init Cal.com under the 'booking' namespace
      Cal("init", "booking", { origin: "https://cal.com" });
    </script>

    <!-- Ensure correct calLink preload (Vite will process import.meta.env) -->
    <script type="module">
      const raw = import.meta.env.VITE_CAL_LINK || "dmitrybond/intro-30m";
      const link = raw
        .trim()
        .replace(/^https?:\/\/(www\.)?cal\.com\//i, "")
        .replace(/^\/+/, "")
        .replace(/\/+$/, "") || "dmitrybond/intro-30m";
      // Optional UI tuning
      Cal.ns["booking"]("ui", { layout: "month_view" });
      Cal.ns["booking"]("preload", { calLink: link });
    </script>

    <!-- Telegram UX nudge (safe no-op outside Telegram) -->
    <script>
      if (window.Telegram && Telegram.WebApp) {
        try { Telegram.WebApp.expand(); } catch (_) {}
      }
    </script>

    <script type="module">
      if (location.pathname.startsWith('/chat')) {
        import('/src/chat-entry.tsx');
      } else {
        import('/src/main.tsx');
      }
    </script>
  </body>
</html>
