<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniApp Web</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="icons/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Initialize Telegram WebApp if present (guarded)
      try {
        var tg = window && window.Telegram && window.Telegram.WebApp;
        if (tg && typeof tg.ready === 'function') {
          try { if (typeof tg.expand === 'function') tg.expand(); } catch (e) { console.warn('TG expand skipped', e); }
          tg.ready();
        }
      } catch (e) { console.warn('TG init skipped', e); }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
